[env:m5stack-core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default_16MB.csv   ; 6.25MB app: room for the Wi-Fi/ESP-NOW stack (same offsets as before)
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue   ; Crucial stability flag for ESP32 PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_BT_ENABLED=0           ; Force-disable Bluetooth stack memory reservation
    -DCONFIG_DISABLE_HAL_LOCKS=1    ; Removes internal HAL locking overhead to save DRAM

lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.2
monitor_filters = esp32_exception_decoder
extra_scripts = post:merge_bin.py
